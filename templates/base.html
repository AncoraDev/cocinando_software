<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}CRM{% endblock %}</title>
    <!-- <script src="https://cdn.tailwindcss.com"></script> -->
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>

</head>
<body class="bg-gray-100 font-sans">
    <div class="bg-gray-800 text-white px-6 py-3 flex justify-between items-center">
        <div class="text-lg font-bold">CRM Interno</div>
        <div class="text-sm">
            {{ cliente.nombre }} |
            <a href="{% url 'logout_cliente' %}" class="text-yellow-400 hover:underline">Cerrar sesión</a>
        </div>
    </div>
    <div class="bg-gray-700 px-6 py-2">
        <a href="{% url 'dashboard_cliente' %}" class="text-white font-semibold mr-4 px-2 py-1 rounded hover:bg-blue-600 {% if active == 'dashboard' %}bg-blue-600{% endif %}">Dashboard</a>
        <a href="{% url 'listado_clientes' %}" class="text-white font-semibold px-2 py-1 rounded hover:bg-blue-600 {% if active == 'clientes' %}bg-blue-600{% endif %}">Clientes</a>
    </div>
    <div class="p-6">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
