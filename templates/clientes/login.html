<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans flex items-center justify-center min-h-screen">
    <div class="bg-white p-6 rounded shadow w-full max-w-sm">
        <h2 class="text-xl font-semibold text-center mb-6">Acceso</h2>
        <form method="POST" action="{% url 'procesar_login_cliente' %}" class="space-y-4">
            {% csrf_token %}
            <div>
                <label for="email" class="block font-medium text-sm text-gray-700">Email</label>
                <input type="text" id="email" name="email"
                       class="mt-1 block w-full px-3 py-2 border rounded-md focus:outline-none focus:ring focus:border-blue-300">
            </div>
            <div>
                <label for="password" class="block font-medium text-sm text-gray-700">Contraseña</label>
                <input type="password" id="password" name="password"
                       class="mt-1 block w-full px-3 py-2 border rounded-md focus:outline-none focus:ring focus:border-blue-300">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 px-4 rounded">
                Entrar
            </button>
        </form>

        {% if messages %}
            <div class="mt-4 text-red-600 text-sm">
            {% for message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
            </div>
        {% endif %}
    </div>
</body>
</html>
