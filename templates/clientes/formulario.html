<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% if modo == 'editar' %}Editar{% else %}Crear{% endif %} Cliente</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f1f1f1;
            display: flex;
            justify-content: center;
            padding: 40px;
        }

        .form-container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            width: 500px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin: 10px 0 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            margin-top: 20px;
            cursor: pointer;
        }

        button:hover {
            background-color: #218838;
        }

        a {
            display: inline-block;
            margin-top: 15px;
            text-align: center;
            color: #007bff;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>{% if modo == 'editar' %}Editar{% else %}Crear{% endif %} Cliente</h2>
        <form method="POST">
            {% csrf_token %}

            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre"
                   value="{% if cliente %}{{ cliente.user.first_name }}{% endif %}" required>

            <label for="razon_social">Razón Social:</label>
            <input type="text" id="razon_social" name="razon_social"
                   value="{{ cliente.razon_social|default_if_none:'' }}">

            <label for="cif">CIF:</label>
            <input type="text" id="cif" name="cif"
                   value="{{ cliente.cif|default_if_none:'' }}" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email"
                   value="{% if cliente %}{{ cliente.user.email }}{% endif %}" required>

            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password"
                   placeholder="{% if modo == 'editar' %}Dejar en blanco para mantener la misma{% else %}Contraseña{% endif %}">

            <button type="submit">
                {% if modo == 'editar' %}Guardar cambios{% else %}Crear cliente{% endif %}
            </button>
        </form>

        <a href="{% url 'listado_clientes' %}">← Volver al Listado</a>
    </div>
</body>
</html>
