<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% if modo == 'editar' %}Editar{% else %}Crear{% endif %} Cliente</title>
</head>
<body>
    <h2>{% if modo == 'editar' %}Editar{% else %}Crear{% endif %} Cliente</h2>

    <form method="POST">
        {% csrf_token %}

        <label for="nombre">Nombre:</label><br>
        <input type="text" id="nombre" name="nombre" value="{{ cliente.nombre|default_if_none:'' }}"><br><br>

        <label for="razon_social">Razón Social:</label><br>
        <input type="text" id="razon_social" name="razon_social" value="{{ cliente.razon_social|default_if_none:'' }}"><br><br>

        <label for="cif">CIF:</label><br>
        <input type="text" id="cif" name="cif" value="{{ cliente.cif|default_if_none:'' }}"><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" value="{{ cliente.email|default_if_none:'' }}"><br><br>

        <label for="password">Contraseña:</label><br>
        <input type="text" id="password" name="password" value="{{ cliente.password|default_if_none:'' }}"><br><br>

        <button type="submit">
            {% if modo == 'editar' %}Guardar cambios{% else %}Crear cliente{% endif %}
        </button>
    </form>

    <br>
    <a href="{% url 'listado_clientes' %}">← Volver al Listado</a>
</body>
</html>
